name: pylint

on: [push]

jobs:
  pyqt5:
    runs-on: ubuntu-24.04
    name: pyqt5
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq qtbase5-dev pyqt5-dev-tools python3-pyqt5.qtsvg python3-pyqt6.qtsvg pylint
      - name: Build frontend
        run: |
          make FRONTEND_TYPE=5 frontend -j $(nproc)
      - name: Run pylint
        run: |
          /usr/bin/pylint -E --extension-pkg-allow-list=PyQt5,PyQt6 source/frontend/carla_{app,backend,shared,utils}.py

  pyqt6:
    runs-on: ubuntu-24.04
    name: pyqt6
    steps:
      - uses: actions/checkout@v3
      - name: Install deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq qt6-base-dev pyqt6-dev-tools python3-pyqt5.qtsvg python3-pyqt6.qtsvg pylint
      - name: Build frontend
        run: |
          make FRONTEND_TYPE=6 frontend -j $(nproc)
      - name: Run pylint
        run: |
          /usr/bin/pylint -E --extension-pkg-allow-list=PyQt5,PyQt6 source/frontend/carla_{app,backend,shared,utils}.py
