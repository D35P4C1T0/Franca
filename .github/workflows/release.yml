name: Release Binaries & AppImage

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (defaults to Makefile VERSION)'
        required: false
        default: ''

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64 (Prebuilt Tarball + AppImage)
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Resolve release version
        id: meta
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VER="${{ github.event.inputs.version }}"
          elif [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/v}"
          else
            VER="$(sed -n 's/^VERSION[[:space:]]*:=[[:space:]]*//p' Makefile | head -n1)"
          fi
          VER="${VER#v}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
          echo "Resolved version: ${VER}"

      - name: Install build dependencies (C++, Qt 6, Kirigami 6, Audio)
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -yqq \
            build-essential cmake pkg-config clang libclang-dev patchelf desktop-file-utils file zstd xvfb \
            g++-multilib libx11-6:i386 libxext6:i386 \
            libasound2-dev libfluidsynth-dev libgl1-mesa-dev liblo-dev libmagic-dev \
            libpulse-dev libsdl2-dev libsndfile1-dev libjack-jackd2-dev \
            libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-svg-dev qt6-wayland qt6-l10n-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-org-kde-kirigami libkf6kirigami-dev \
            pyqt6-dev-tools python3-pyqt6
          sudo ln -sf /usr/lib/i386-linux-gnu/libX11.so.6 /usr/lib/i386-linux-gnu/libX11.so
          sudo ln -sf /usr/lib/i386-linux-gnu/libXext.so.6 /usr/lib/i386-linux-gnu/libXext.so

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/frontend-rs

      - name: Build Franca backend, bridges, discovery, and Rust UI
        run: |
          make features
          make -j"$(nproc)"
          make posix32 -j"$(nproc)"
          make rust-ui

      - name: Run Franca smoke tests, Rust tests, and UI regression suite
        run: |
          make check-franca
          make check-rust-ui
          make check-ui-contracts
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" python3 scripts/ui_smoke.py -v

      - name: Build prebuilt Linux binary archive
        run: |
          chmod +x scripts/build-release-bundle.sh scripts/build-appimage.sh
          ./scripts/build-release-bundle.sh --no-build --arch=x86_64 --version="${{ steps.meta.outputs.version }}"

      - name: Build AppImage
        run: |
          ./scripts/build-appimage.sh --no-build --arch=x86_64 --version="${{ steps.meta.outputs.version }}"

      - name: Generate combined checksums
        run: |
          cd dist
          sha256sum Franca-*.tar.gz Franca-*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: franca-linux-x86_64-${{ steps.meta.outputs.version }}
          path: |
            dist/Franca-*.tar.gz
            dist/Franca-*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/Franca-*.tar.gz
            dist/Franca-*.AppImage
            dist/SHA256SUMS.txt
