name: Build and Release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version string (defaults to Makefile VERSION)'
        required: false
        default: ''

permissions:
  contents: read

env:
  DEBIAN_FRONTEND: noninteractive
  CARGO_TERM_COLOR: always

jobs:
  build-linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-24.04
    container:
      image: debian:13
    defaults:
      run:
        shell: bash

    steps:
      - name: Install build dependencies (C++, Qt 6, Kirigami 6, Audio)
        run: |
          dpkg --add-architecture i386
          apt-get update -qq
          apt-get install -yqq \
            ca-certificates curl git \
            build-essential cmake pkg-config clang libclang-dev patchelf desktop-file-utils file zstd xvfb \
            g++-multilib libx11-6:i386 libxext6:i386 \
            libasound2-dev libfluidsynth-dev libgl-dev liblo-dev libmagic-dev \
            libpulse-dev libsdl2-dev libsndfile1-dev libjack-jackd2-dev \
            libx11-dev libxcursor-dev libxext-dev libxrandr-dev \
            qt6-base-dev qt6-base-dev-tools qt6-declarative-dev qt6-declarative-dev-tools \
            qt6-svg-dev qt6-wayland qt6-l10n-tools \
            qml6-module-qtquick qml6-module-qtquick-controls qml6-module-qtquick-layouts \
            qml6-module-qtquick-templates qml6-module-qtquick-window qml6-module-qtqml-workerscript \
            qml6-module-org-kde-kirigami \
            pyqt6-dev-tools python3-pyqt6
          ln -sf /usr/lib/i386-linux-gnu/libX11.so.6 /usr/lib/i386-linux-gnu/libX11.so
          ln -sf /usr/lib/i386-linux-gnu/libXext.so.6 /usr/lib/i386-linux-gnu/libXext.so

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: source/frontend-rs

      - name: Build Franca backend, bridges, discovery, and Rust UI
        run: |
          make features
          make -j"$(nproc)"
          make posix32 -j"$(nproc)"

      - name: Run Franca smoke tests, Rust tests, and UI regression suite
        run: |
          make check-franca
          make check-rust-ui
          make check-ui-contracts
          QT_QPA_PLATFORM=xcb LIBGL_ALWAYS_SOFTWARE=1 xvfb-run -a -s "-screen 0 1280x800x24" python3 scripts/ui_smoke.py -v

      - name: Package Linux tarball and AppImage
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          version=$(bash scripts/package-version.sh "$REQUESTED_VERSION")
          bash scripts/build-release-bundle.sh --no-build --version="$version"
          bash scripts/build-appimage.sh --no-build --version="$version"

      - name: Generate combined checksums
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        run: |
          cd dist
          sha256sum Franca-*.tar.gz Franca-*.AppImage > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Upload build artifacts
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: franca-linux-x86_64
          path: |
            dist/Franca-*.tar.gz
            dist/Franca-*.AppImage
            dist/SHA256SUMS.txt
          if-no-files-found: error

  build-flatpak:
    name: Flatpak x86_64
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Set up Flatpak build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -yqq flatpak flatpak-builder elfutils
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub \
            org.kde.Platform//6.10 org.kde.Sdk//6.10 org.freedesktop.Sdk.Extension.rust-stable//25.08
      - name: Build Flatpak bundle
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          app_id=io.github.d35p4c1t0.Franca
          version=$(bash scripts/package-version.sh "$REQUESTED_VERSION")
          mkdir -p build dist
          flatpak-builder --user --repo=build/flatpak-repo build/flatpak "data/flatpak/$app_id.yml"
          flatpak build-bundle --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            build/flatpak-repo "dist/Franca-$version-x86_64.flatpak" "$app_id"
      - uses: actions/upload-artifact@v4
        with:
          name: franca-flatpak-x86_64
          path: dist/Franca-*.flatpak
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [build-linux-x86_64, build-flatpak]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: franca-*
          path: dist
          merge-multiple: true
      - name: Generate release checksums
        working-directory: dist
        run: sha256sum Franca-*.tar.gz Franca-*.AppImage Franca-*.flatpak > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/Franca-*.tar.gz
            dist/Franca-*.AppImage
            dist/Franca-*.flatpak
            dist/SHA256SUMS.txt
